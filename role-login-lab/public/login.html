<!DOCTYPE html>
<html>
<head>
    <title>Login | Lab 4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #fff5f8;
            color: #444;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        h1 {
            text-align: center;
            color: #d64891;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(214, 72, 145, 0.08);
        }

        h2 {
            color: #b83b7a;
            font-size: 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 0 0 15px;
            border: 1px solid #f0c8d8;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e85ab1;
        }

        button {
            width: 100%;
            background-color: #e85ab1;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #d64891;
        }

        p {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        a {
            color: #e85ab1;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            color: #c53890;
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome</h1>
        <div class="card">
            <div id="loginForm">
                <h2>Sign In</h2>
                <input type="email" id="loginEmail" placeholder="Email">
                <input type="password" id="loginPassword" placeholder="Password">
                <button onclick="handleLogin()">Login</button>
                <p>Don't have an account? <a href="#" onclick="toggleForms()">Register here</a></p>
            </div>

            <div id="registerForm" class="hidden">
                <h2>Create Account</h2>
                <input type="text" id="regName" placeholder="Full Name">
                <input type="email" id="regEmail" placeholder="Email">
                <input type="password" id="regPassword" placeholder="Password">
                <button onclick="handleRegister()">Register</button>
                <p>Already have an account? <a href="#" onclick="toggleForms()">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        function toggleForms() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('registerForm').classList.toggle('hidden');
        }

        async function handleRegister() {
  const password = document.getElementById('regPassword').value;
  
  const hasNumber = /(?=.*[0-9])/.test(password);
  const hasUpper = /(?=.*[A-Z])/.test(password);
  
  if (!hasNumber) {
    alert("Password must contain at least one number!");
    return; // hindi tutuloy
  }
  if (!hasUpper) {
    alert("Password must contain at least one uppercase letter!");
    return;
  }
  
  const body = {
    name: document.getElementById('regName').value,
    email: document.getElementById('regEmail').value,
    password: password
  };
  const res = await fetch('/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (res.status === 201) alert('Registered! You may log in.');
  else if (res.status === 409) alert('Email already exists');
  else alert('Registration failed');
}

        async function handleLogin() {
            const body = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) return alert('Invalid email or password');

            const data = await res.json();
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));

            window.location.href =
                data.user.role === 'admin' ? 'admin.html' :
                data.user.role === 'staff' ? 'staff.html' : 'user.html';
        }
    </script>
</body>
</html>
