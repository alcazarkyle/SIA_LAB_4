<!DOCTYPE html>
<html>
<head>
    <title>Login | Lab 4</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        input { width: 100%; margin: 8px 0; padding: 10px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Login</h1>
    
    <div id="loginForm">
        <h2>Sign In</h2>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="handleLogin()">Login</button>
        <p>Don't have an account? <a href="#" onclick="toggleForms()">Register here</a></p>
    </div>
    
    <div id="registerForm" class="hidden">
        <h2>Register</h2>
        <input type="text" id="regName" placeholder="Full Name">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPassword" placeholder="Password">
        <button onclick="handleRegister()">Register</button>
        <p>Already have an account? <a href="#" onclick="toggleForms()">Login here</a></p>
    </div>

    <script>
        function toggleForms() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('registerForm').classList.toggle('hidden');
        }

        async function handleRegister() {
            const body = {
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value
            };
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (res.status === 201) alert('Registered! You may log in.');
            else if (res.status === 409) alert('Email already exists');
            else alert('Registration failed');
        }

        async function handleLogin() {
            const body = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) return alert('Invalid email or password');
            
            const data = await res.json();
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            
            window.location.href = 
                data.user.role === 'admin' ? 'admin.html' :
                data.user.role === 'staff' ? 'staff.html' : 'user.html';
        }
    </script>
</body>
</html>
