<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial; max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f4f4f4; }
        button { padding: 5px 10px; margin: 2px; cursor: pointer; }
        #liveFeed { background: #f9f9f9; padding: 15px; border-radius: 5px; height: 150px; overflow-y: auto; }
        .hidden { display: none; }
        #editModal { background: white; padding: 20px; border: 1px solid #ccc; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; }
        .overlay { background: rgba(0,0,0,0.5); position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        .overlay.show { display: block; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <h1>🔐 Admin Dashboard</h1>
    <p>Welcome, <span id="adminName"></span> | <a href="#" onclick="logout()">Logout</a></p>

    <h3>🔴 Live Login Feed</h3>
    <ul id="liveFeed"></ul>

    <h3>📢 Send Broadcast</h3>
    <input type="text" id="broadcastInput" placeholder="Type announcement..." style="padding: 8px; width: 300px;">
    <button onclick="sendBroadcast()">Send</button>

    <h3>👥 User Management</h3>
    <table>
        <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr>
        </thead>
        <tbody id="userTableBody"></tbody>
    </table>

    <div id="overlay" class="overlay" onclick="closeModal()"></div>
    <div id="editModal" class="hidden">
        <h3>Edit User</h3>
        <input type="hidden" id="editId">
        <p>Name: <input type="text" id="editName"></p>
        <p>Email: <input type="email" id="editEmail"></p>
        <p>Role: 
            <select id="editRole">
                <option value="user">User</option>
                <option value="staff">Staff</option>
                <option value="admin">Admin</option>
            </select>
        </p>
        <button onclick="saveUser()">Save</button>
        <button onclick="closeModal()">Cancel</button>
    </div>

    <script>
        const socket = io();
        let cachedUsers = [];
        const user = JSON.parse(localStorage.getItem('user'));
        document.getElementById('adminName').textContent = user?.name || 'Admin';

        socket.on('user_logged_in', (data) => {
            const li = document.createElement('li');
            li.textContent = `${data.name} (${data.role}) logged in at ${new Date(data.time).toLocaleTimeString()}`;
            document.getElementById('liveFeed').prepend(li);
        });

        socket.on('new_announcement', (data) => {
            alert('📢 New Announcement: ' + data.message);
        });

        async function loadUsers() {
            const res = await fetch('/api/users', {
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });
            cachedUsers = await res.json();
            renderUsers();
        }

        function renderUsers() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = cachedUsers.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td>${u.role}</td>
                    <td>
                        <button onclick="editUser(${u.id})">Edit</button>
                        <button onclick="deleteUser(${u.id})">Delete</button>
                    </td>
                </tr>`).join('');
        }

        function editUser(id) {
            const u = cachedUsers.find(x => x.id === id);
            document.getElementById('editId').value = u.id;
            document.getElementById('editName').value = u.name;
            document.getElementById('editEmail').value = u.email;
            document.getElementById('editRole').value = u.role;
            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('overlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
            document.getElementById('overlay').classList.remove('show');
        }

        async function saveUser() {
            const id = document.getElementById('editId').value;
            const body = {
                name: document.getElementById('editName').value,
                email: document.getElementById('editEmail').value,
                role: document.getElementById('editRole').value
            };
            const res = await fetch(`/api/users/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify(body)
            });
            if (res.status === 204) { closeModal(); loadUsers(); }
            else if (res.status === 409) alert('Email already in use');
        }

        async function deleteUser(id) {
            if (!confirm('Delete this user?')) return;
            const res = await fetch(`/api/users/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });
            if (res.status === 204) loadUsers();
            else if (res.status === 400) alert('You cannot delete yourself');
        }

        async function sendBroadcast() {
            const message = document.getElementById('broadcastInput').value;
            const res = await fetch('/api/broadcast', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify({ message })
            });
            if (res.status === 201) document.getElementById('broadcastInput').value = '';
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        loadUsers();
    </script>
</body>
</html>
